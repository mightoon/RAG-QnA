  working_summary_max_tokens: 400
  session_archive_after_minutes: 120
  long_term_enabled: true
  topic_switch_threshold: 0.45
ephemeral:
  enabled: true
  ttl_hours: 2
  max_file_size_mb: 50
  max_files_per_session: 5
  target_seconds: 30
ingest:
  concurrency: 4
  retry_backoff_seconds:
  - 60
  - 300
  - 900
  max_retries: 3
  verify_sample_size: 6
  batch_upsert_size: 500
notification:
  email_enabled: false
  webhook_enabled: false
  smtp_host: ''
  smtp_port: 465
  smtp_user: ''
  smtp_password: ''
  smtp_from: ''
  webhook_url: ''
  webhook_secret: ''
consistency_check:
  enabled: true
  interval_hours: 1
  sample_docs: 100
  alert_threshold: 10
observability:
  log_level: INFO
  log_json: true
  metrics_enabled: true
  pushgateway_url: ''
  tracing_enabled: false
  otlp_endpoint: ''
permissions:
- role: admin
  collections:
  - '*'
  is_admin: true
prompts:
  system_prompt: 你是企业知识库问答助手。严格依据提供的参考文档回答问题， 在关键陈述后用 [文档N] 标注来源；若参考文档不足以回答， 明确说明知识库中没有相关信息，不要编造。
  enable_cot: false
  temperature: 0.3
  max_answer_tokens: 2048
  intent_few_shots: []
  rerank_fallback_prompt: ''
workflows_file: customer/workflows.yaml
default_collection: default
max_upload_mb: 500
server_ingest_root: null
