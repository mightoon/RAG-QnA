# 同义词表（customer/synonyms.yaml）
#
# groups:    同义组（组内词互为同义词，检索时双向扩展）
# normalize: 口语词 → 标准术语（单向归一，实体链接前使用）
#
# 修改后自动热加载（auto_reload_minutes），无需重启服务。

groups:
  - [华为, 华为技术有限公司, HUAWEI]
  - [交换机, 网络交换机, switch]
  - [路由器, router]
  - [防火墙, fire wall, FW]
  - [VPN, 虚拟专用网络]
  - [工单, 服务单, ticket]
  - [密码重置, 改密码, 修改密码]
  - [入职, 新员工报到, onboarding]
  - [报销, 费用报销, 报销流程]
  - [OA, 办公自动化系统]
  - [ERP, 企业资源计划系统]
  - [年假, 带薪年休假, 年休]

normalize:
  电脑: 笔记本电脑
  打印机坏了: 打印机故障
  上不了网: 网络连接故障
  开不了机: 无法开机
  发票: 增值税发票
